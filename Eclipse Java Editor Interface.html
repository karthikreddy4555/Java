        code: `package Java_Lab;

import java.io.File;

public class DisplayFiles 
{ 
    public void printFiles(File[] a, int i, int lvl) 
    { 
        // base case of the recursion 
        // i == a.length means the directory has 
        // no more files. Hence, the recursion has to stop 
        if (i == a.length) 
        { 
            return; 
        } 
        // tabs for providing the indentation 
        // for the files of sub-directory 
        for (int j = 0; j < lvl; j++) 
        { 
            System.out.print("\\t"); 
        } 
        // checking if the encountered object is a file or not 
        if (a[i].isFile()) 
        { 
            System.out.println(a[i].getName()); 
        } 
        // for sub-directories 
        else if (a[i].isDirectory()) 
        { 
            System.out.println("[" + a[i].getName() + "]"); 
            // recursion for sub-directories 
            printFiles(a[i].listFiles(), 0, lvl + 1); 
        } 
        // recursively printing files from the directory 
        // i + 1 means look for the next file 
        printFiles(a, i + 1, lvl); 
    } 

    // Main Method 
    public static void main(String[] argvs) 
    { 
        // Providing the full path for the directory 
        String path = "D:\\\\Java Programs"; 
        // creating a file object 
        File f = new File(path); 
        // creating an object of the class DisplayFiles 
        DisplayFiles obj = new DisplayFiles(); 
        if (f.exists() && f.isDirectory()) 
        { 
            // array for the files of the directory pointed by f 
            File a[] = f.listFiles(); 
            // display statements 
            System.out.println("= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = ="); 
            System.out.println("Displaying Files from the directory: " + f);

            // Calling the method 
            obj.printFiles(a, 0, 0); 
        } 
    } 
}`

                switch (operator) {

    // Eclipse Java Keywords
    const JAVA_KEYWORDS = new Set([
      "package", "import", "public", "private", "protected", "class", "interface",
      "extends", "implements", "void", "int", "double", "float", "char", "boolean",
      "long", "short", "byte", "if", "else", "for", "while", "do", "switch", "case",
      "break", "continue", "return", "try", "catch", "finally", "throw", "throws",
      "new", "this", "super", "static", "final", "null", "true", "false"
    ]);

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Syntax Highlighter for a single line of Java code
    function highlightJavaLine(line, inBlockCommentState) {
      if (inBlockCommentState.active) {
        const endIdx = line.indexOf("*/");
        if (endIdx === -1) {
          return `<span class="tok-com">${escapeHtml(line)}</span>`;
        } else {
          const before = line.slice(0, endIdx + 2);
          const rest = line.slice(endIdx + 2);
          inBlockCommentState.active = false;
          return `<span class="tok-com">${escapeHtml(before)}</span>` + highlightJavaLine(rest, inBlockCommentState);
        }
      }

      // Check for block comment start
      const blockStart = line.indexOf("/*");
      const lineCommentStart = line.indexOf("//");

      if (blockStart !== -1 && (lineCommentStart === -1 || blockStart < lineCommentStart)) {
        const before = line.slice(0, blockStart);
        const after = line.slice(blockStart);
        inBlockCommentState.active = true;
        return highlightCodeTokens(before) + highlightJavaLine(after, inBlockCommentState);
      }

      if (lineCommentStart !== -1) {
        // Make sure // isn't inside quotes
        let inQuotes = false;
        let realCommentIdx = -1;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"' && line[i - 1] !== '\\') inQuotes = !inQuotes;
          if (!inQuotes && line[i] === '/' && line[i + 1] === '/') {
            realCommentIdx = i;
            break;
          }
        }
        if (realCommentIdx !== -1) {
          const codePart = line.slice(0, realCommentIdx);
          const comPart = line.slice(realCommentIdx);
          return highlightCodeTokens(codePart) + `<span class="tok-com">${escapeHtml(comPart)}</span>`;
        }
      }

      return highlightCodeTokens(line);
    }

    function highlightCodeTokens(text) {
      // Tokenize strings, chars, identifiers, and symbols
      const tokenRegex = /("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|\b([A-Za-z_][A-Za-z0-9_]*)\b/g;
      let result = "";
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(text)) !== null) {
        result += escapeHtml(text.slice(lastIndex, match.index));
        const [fullMatch, strLiteral, charLiteral, identifier] = match;

        if (strLiteral || charLiteral) {
          result += `<span class="tok-str">${escapeHtml(fullMatch)}</span>`;
        } else if (identifier) {
          if (JAVA_KEYWORDS.has(identifier)) {
            result += `<span class="tok-kw">${escapeHtml(identifier)}</span>`;
          } else {
            result += escapeHtml(identifier);
          }
        }
        lastIndex = tokenRegex.lastIndex;
      }

      result += escapeHtml(text.slice(lastIndex));
      return result;
    }

      const consolePane = document.getElementById("consolePane");
      if (show) {
        consolePane.classList.remove("hidden-pane");
      } else {
        consolePane.classList.add("hidden-pane");
      }
    }

    function runSimulatedConsole() {
      const file = JAVA_FILES[activeFileIndex];
      const className = file.name.replace(".java", "");
      document.getElementById("consoleHeaderInfo").innerHTML =
        `&lt;terminated&gt; ${className} [Java Application] C:\\Program Files\\Java\\jdk-17\\bin\\javaw.exe`;
      document.getElementById("consoleOutput").textContent = file.consolePreview;
      toggleConsole(true);
    }

    // Quick Outline / Search Modal (Ctrl+O or Ctrl+Shift+T)
    function openQuickOutline() {
      const backdrop = document.getElementById("quickModalBackdrop");
      const input = document.getElementById("quickSearchInput");
      backdrop.classList.add("open");
      input.value = "";
      quickSelectedIdx = 0;
      filterQuickList("");
      setTimeout(() => input.focus(), 20);
    }

    function closeQuickOutline() {
      document.getElementById("quickModalBackdrop").classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "quickModalBackdrop") {
        closeQuickOutline();
      }
    }

    function filterQuickList(query) {
      const q = query.trim().toLowerCase();
      filteredQuickItems = JAVA_FILES.map((file, index) => ({ ...file, index })).filter(
        (item) => item.name.toLowerCase().includes(q) || item.code.toLowerCase().includes(q)
      );
      if (quickSelectedIdx >= filteredQuickItems.length) {
        quickSelectedIdx = 0;
      }
      renderQuickList();
    }

    function renderQuickList() {
      const listEl = document.getElementById("quickList");
      listEl.innerHTML = "";

      if (filteredQuickItems.length === 0) {
        listEl.innerHTML = `<div style="padding: 6px; color: #777;">No matching types found</div>`;
        return;
      }

      filteredQuickItems.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "quick-item" + (idx === quickSelectedIdx ? " active" : "");
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="j-icon">J</span>
            <span>${item.name.replace(".java", "")} - <span style="color:#666;">Java_Lab</span></span>
          </div>
          <span style="color:#888; font-size:11px;">${item.name}</span>
        `;
        row.onclick = () => {
          selectFile(item.index);
          stealthCopyCode();
          closeQuickOutline();
        };
        listEl.appendChild(row);
      });
    }

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      const modalOpen = document.getElementById("quickModalBackdrop").classList.contains("open");

      // Ctrl+O or Ctrl+Shift+T to open Quick Search
      if ((e.ctrlKey && e.key.toLowerCase() === "o") || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "t")) {
        e.preventDefault();
        if (modalOpen) closeQuickOutline();
        else openQuickOutline();
        return;
      }

      // Ctrl+S or Alt+C to stealth copy current file
      if ((e.ctrlKey && e.key.toLowerCase() === "s") || (e.altKey && e.key.toLowerCase() === "c")) {
        e.preventDefault();
        stealthCopyCode();
        return;
      }

      // Ctrl+M to maximize/restore editor pane (authentic Eclipse shortcut!)
      if (e.ctrlKey && e.key.toLowerCase() === "m") {
        e.preventDefault();
        toggleMaximizeEditor();
        return;
      }

      if (modalOpen) {
        if (e.key === "Escape") {
          e.preventDefault();
          closeQuickOutline();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (filteredQuickItems.length > 0) {
            quickSelectedIdx = (quickSelectedIdx + 1) % filteredQuickItems.length;
            renderQuickList();
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (filteredQuickItems.length > 0) {
            quickSelectedIdx = (quickSelectedIdx - 1 + filteredQuickItems.length) % filteredQuickItems.length;
            renderQuickList();
          }
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (filteredQuickItems[quickSelectedIdx]) {
            selectFile(filteredQuickItems[quickSelectedIdx].index);
            stealthCopyCode();
            closeQuickOutline();
          }
        }
      }
    });

    document.getElementById("quickSearchInput").addEventListener("input", (e) => {
      quickSelectedIdx = 0;
      filterQuickList(e.target.value);
    });

    // Initialize Workspace on Load
    window.onload = () => {
      renderPackageExplorer();
      renderEditorTabs();
      renderEditorCode();
    };
  </script>
</body>
</html>
